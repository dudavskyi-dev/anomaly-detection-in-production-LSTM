[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdm-sentinel"
version = "0.1.0"
description = "Predictive maintenance and anomaly detection for industrial turbofan telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy~=2.1.0",
    "pandas~=2.2.0",
    "pyarrow~=18.0.0",
    "scikit-learn~=1.5.0",
    "pydantic~=2.9.0",
    "pydantic-settings~=2.6.0",
    "typer~=0.12.0",
    "click~=8.1.0",
    "requests~=2.32.0",
    "pandera~=0.20.0",
    "ucimlrepo~=0.0.7",
    "matplotlib~=3.9.0",
    "psutil~=6.0.0",
    "scipy~=1.17.0",
]

[project.optional-dependencies]
torch = [
    "torch~=2.14.0",
]
tf = [
    "tensorflow~=2.21.0",
]
serving = [
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.30.0",
    "prometheus-client~=0.20.0",
]
tracking = [
    "mlflow~=2.22.0",
]
monitoring = [
    "prometheus-client~=0.20.0",
]
dev = [
    "pytest~=8.2.0",
    "pytest-cov~=5.0.0",
    "ruff~=0.6.0",
    "black~=24.4.0",
    "mypy~=1.10.0",
    "hypothesis~=6.100.0",
    "types-requests~=2.32.0",
    "httpx~=0.28.0",
]
all = [
    "pdm-sentinel[torch,tf,serving,tracking,monitoring,dev]",
]

[project.scripts]
pdm = "pdm.cli:app"

[tool.setuptools.packages.find]
include = ["pdm*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# typer's idiomatic CLI declarations call Argument()/Option() as parameter defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
markers = [
    "fast: quick tests safe to run on every save",
]

[tool.coverage.run]
source = ["pdm"]

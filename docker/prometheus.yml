# Scrape interval/retention and the two scrape targets are deliberate, not defaults --
# see docs/decisions/P10-monitoring.md for the measurements behind each choice.

global:
  # 15s: fast enough that a Grafana panel redrawn during a live demo visibly moves, and cheap
  # enough for a two-target, single-node dev setup that this isn't a meaningful resource cost.
  # A real fleet-scale deployment would widen this; nothing here needs sub-15s resolution.
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The live API: request/latency/model metrics (pdm/serving/metrics.py).
  - job_name: pdm-api
    static_configs:
      - targets: ["api:8000"]

  # The periodic drift-check job (pdm/monitoring/metrics.py) writes a Prometheus textfile;
  # node-exporter's textfile collector is the standard way to turn that into a scrape target
  # without the batch job needing to run its own HTTP server (see docs/decisions/P09-drift.md's
  # reasoning for the textfile-collector choice in the first place).
  - job_name: pdm-drift-job
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
